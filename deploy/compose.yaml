# The workspace locally: its own Valkey (sessions) and the workspace image.
# frappe-api is not part of this stack: start it from its own checkout (`just stack up` in frappe-api), and the
# workspace reaches it on the host through host.docker.internal.
# Usage: cp deploy/.env.example deploy/.env (optional, only to move ports), then `just stack up`
# (or `docker compose -f deploy/compose.yaml up -d --build`).
name: frappe-workspace

services:
  # The BFF's own Valkey: never frappe-api's. Published on the loopback only, on 6380 so it does not collide with
  # frappe-api's Valkey on 6379.
  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    # SEC-02: sessions survive a restart (AOF, fsync every second) and are never evicted.
    command:
      [
        'valkey-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction'
      ]
    ports: ['127.0.0.1:${WORKSPACE_VALKEY_PORT:-6380}:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    image: frappe-workspace:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      valkey: { condition: service_healthy }
    ports: ['127.0.0.1:${WORKSPACE_PORT:-4000}:3000']
    # Linux needs this mapping for host.docker.internal; Docker Desktop has it already.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      # adapter-bun: the public origin, so SvelteKit's CSRF check accepts form posts and remote functions.
      ORIGIN: http://localhost:${WORKSPACE_PORT:-4000}
      # Its own name: the root .env's FRAPPE_API_BASE_URL is the host's address, not the container's.
      FRAPPE_API_BASE_URL: ${WORKSPACE_FRAPPE_API_URL:-http://host.docker.internal:8080}
      VALKEY_URL: redis://valkey:6379/0
    healthcheck:
      # The image has no curl: Bun itself asks the server whether it is ready (its Valkey answers).
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  valkey-data:
