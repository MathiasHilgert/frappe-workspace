# Git hooks (CRAFT-03): commitlint on commit-msg, fast checks on staged files, light pre-push.
# The full gate (`bun run gate`, e2e) runs in CI once a remote exists. Install with `bunx lefthook install`.
# https://lefthook.dev/configuration/

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --config eng/commitlint.config.js --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{js,cjs,ts,svelte,json,jsonc,css,html,md,yml,yaml}'
      run: bunx prettier --check --ignore-unknown {staged_files}

    - name: eslint
      glob: '*.{js,cjs,ts,svelte}'
      run: bunx eslint --max-warnings 0 --no-warn-ignored {staged_files}

    - name: typos
      # typos is a standalone binary (https://github.com/crate-ci/typos); skip with a note when it is missing.
      run: |
        if command -v typos >/dev/null 2>&1; then
          typos --config eng/typos.toml --force-exclude {staged_files}
        else
          echo "typos is not installed; spelling check skipped"
        fi

    - name: hadolint
      glob: 'deploy/Dockerfile'
      # Runs the pinned image offline (same as `just lint-docker`); skip with a note when docker or just is missing.
      run: |
        if command -v docker >/dev/null 2>&1 && command -v just >/dev/null 2>&1; then
          just lint-docker
        else
          echo "docker or just is not installed; Dockerfile lint skipped"
        fi

pre-push:
  parallel: true
  jobs:
    - name: types
      run: bun run check

    - name: eslint
      run: bunx eslint . --max-warnings 0

    - name: knip
      run: bun run deadcode
