# Does it work? Every suite, the coverage they leave (reported, never judged) and the real image started.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    # Pull requests only: any other event runs every job, because a skipped "changes" leaves the outputs empty.
    if: github.event_name == 'pull_request'
    # The self-repository form ($/) is what zizmor prefers, but actionlint 1.7.12 cannot parse it yet.
    uses: ./.github/workflows/changes.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read # the called workflow lists the files the pull request changes

  unit:
    name: Unit tests pass
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run the server tests
        run: bun run test:unit --run --project server
      - name: Run the tests of the CI scripts
        run: bun run test:scripts

  component:
    name: Component tests pass
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          playwright: 'true'
      # In Chromium, headless: the client project renders each component in a real browser.
      - name: Run the component tests
        run: bun run test:unit --run --project client

  integration:
    name: Integration tests pass
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Run the integration tests
        run: bun run test:unit --run --project integration

  architecture:
    name: Architecture rules hold
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Check the layer and feature boundaries
        run: bun run arch

  e2e:
    name: End-to-end tests pass
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The preview build reads sessions from Valkey (SEC-02); the same pinned image as deploy/compose.yaml, on the port
    # tests/playwright.config.ts defaults VALKEY_URL to.
    services:
      valkey:
        image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          playwright: 'true'
      # Builds and previews the app itself (tests/playwright.config.ts) with placeholder variables; passes with no tests.
      - name: Run the end-to-end tests
        run: bun run test:e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Reports, never judges (TEST-09): no percentage fails this job, and vite.config.ts sets no thresholds. The three
  # projects (server, client in Chromium, integration) run in one process, so their coverage is already merged.
  coverage:
    name: Coverage is reported
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the workspace
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
        with:
          playwright: 'true'
      - name: Run every suite with coverage
        run: bun run test:coverage
      - name: Show the coverage in the job summary
        if: ${{ !cancelled() && hashFiles('.svelte-kit/coverage/coverage-summary.json') != '' }}
        run: bun eng/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: .svelte-kit/coverage/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Image builds and starts
    needs: changes
    # Skipped (reported as passing) only when the change provably cannot affect it; see eng/scripts/changes.mjs.
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        uses: ./.github/actions/image # zizmor: ignore[self-repository]
        with:
          as: frappe-workspace:test
          # Only a push to main writes the shared layer cache; pull requests read it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=frappe-workspace,mode=max' || '' }}
      # The distroless image has no shell to run a health check in, so the probe comes from outside. The values only satisfy
      # src/env.ts's validation: nothing listens behind them, so the probe is liveness (no Valkey), not readiness.
      - name: Start the image the way it is deployed (read-only, no capabilities, unprivileged)
        run: >-
          docker run --detach --name workspace --read-only --cap-drop ALL --security-opt no-new-privileges
          --user 65532:65532 --publish 127.0.0.1:3000:3000
          --env FRAPPE_API_BASE_URL=http://frappe-api.invalid --env VALKEY_URL=redis://valkey.invalid:6379/0
          frappe-workspace:test
      - name: Probe GET /health/live
        run: |
          for _ in $(seq 30); do
            curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/health/live && exit 0
            sleep 2
          done
          echo "::error::GET /health/live never answered with a success status"
          exit 1
      - name: Show the container logs
        if: failure()
        run: docker logs workspace
      - name: Stop the container
        if: always()
        run: docker rm --force workspace
