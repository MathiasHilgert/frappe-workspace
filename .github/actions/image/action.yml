# The workspace image, built from deploy/Dockerfile and loaded into the local Docker daemon under a tag. It never pushes:
# the release workflow publishes. Only a run on main writes the shared layer cache; every other run only reads it.
name: Build the workspace image
description: Builds deploy/Dockerfile and loads the image as a local tag

inputs:
  as:
    description: The local tag the image gets
    required: true
  cache-to:
    description: Where to write the layer cache (empty = nowhere)
    default: ''
  from-scratch:
    description: Pull the base images again and use no layer cache (the nightly build)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build the image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deploy/Dockerfile
        load: true
        tags: ${{ inputs.as }}
        pull: ${{ inputs.from-scratch == 'true' }}
        no-cache: ${{ inputs.from-scratch == 'true' }}
        cache-from: ${{ inputs.from-scratch != 'true' && 'type=gha,scope=frappe-workspace' || '' }}
        cache-to: ${{ inputs.cache-to }}
