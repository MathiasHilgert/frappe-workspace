# The workspace ready to build and test: Bun at the version package.json pins (packageManager), the dependencies exactly
# as bun.lock locks them (no install scripts), and the code the build generates (translations and Kit's types).
name: Set up the workspace
description: Installs Bun and the locked dependencies, and generates the translations and Kit types

inputs:
  generate:
    description: Generate the Paraglide messages and Kit's types (type checks, linters, tests and builds need them)
    default: 'true'
  playwright:
    description: Install Chromium for Playwright (component and end-to-end tests)
    default: 'false'
  no-cache:
    description: Download Bun and every package again, ignoring any cache (the nightly build)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
        no-cache: ${{ inputs.no-cache }}
    # --ignore-scripts: no dependency runs code at install time; `prepare` (svelte-kit sync) runs below on purpose.
    - name: Install the locked dependencies
      shell: bash
      env:
        NO_CACHE: ${{ inputs.no-cache }}
      run: |
        flags=(--frozen-lockfile --ignore-scripts)
        if [ "$NO_CACHE" = "true" ]; then
          flags+=(--no-cache)
        fi
        bun install "${flags[@]}"
    - name: Generate the translations and Kit's types
      if: inputs.generate == 'true'
      shell: bash
      run: |
        bunx --no-install paraglide-js compile --project ./i18n/project.inlang --outdir ./src/lib/paraglide --emit-ts-declarations
        bunx --no-install svelte-kit sync
    # The runner image already has Chrome's system libraries, so only the browser is downloaded (no apt, which can take
    # minutes), and it is cached per Playwright version. The headless shell is what headless Chromium runs.
    - name: Read the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: echo "version=$(bun -e 'console.log(require("playwright/package.json").version)')" >> "$GITHUB_OUTPUT"
    - name: Restore the Playwright browsers
      if: inputs.playwright == 'true' && inputs.no-cache != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
    - name: Install Chromium for Playwright
      if: inputs.playwright == 'true'
      shell: bash
      run: bunx --no-install playwright install --only-shell chromium
